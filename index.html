<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Asteroids</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				background: #000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				height: 100vh;
				font-family: monospace;
			}
			canvas {
				border: 1px solid #1a1a2e;
				display: block;
			}
			#hud {
				color: #444;
				font-size: 11px;
				margin-top: 8px;
				letter-spacing: 0.1em;
			}
			#mute {
				position: fixed;
				bottom: 16px;
				right: 16px;
				background: none;
				border: 1px solid #333;
				color: #444;
				font-size: 16px;
				width: 32px;
				height: 32px;
				cursor: pointer;
				font-family: monospace;
			}

			#mute:hover {
				border-color: #888;
				color: #888;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<div id="hud">ARROWS / WASD — rotate &amp; thrust &nbsp;|&nbsp;Space bar - fire&nbsp;|&nbsp;P - pause&nbsp;|&nbsp;wraps at edges</div>
		<button id="mute">♪</button>
		<script src="game.js" type="module"></script>
	</body>
</html>
